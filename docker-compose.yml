# jwworkflow 前后端双镜像编排
# 数据策略：模板、实例化工作流、对话记录等持久化数据以 SQLite 快照固化在后端镜像内（/app/jwworkflow.db）
# 使用 docker compose build && docker compose up -d 启动，docker compose save 导出镜像
services:
  backend:
    image: jwworkflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/jwworkflow.db
      JWT_SECRET: test-secret-for-development
      LLM_API_KEY: sk-dc42126e667a4e899fa68fc3f70b00b7
      LLM_BASE_URL: https://api.deepseek.com
      LLM_DEFAULT_MODEL: deepseek-v4-pro
      UPLOAD_DIR: ./data/uploads
      KNOWLEDGE_DIR: ./data/knowledge
    # 不挂载 volume：SQLite 数据已固化进镜像，容器内为只读快照，重启不丢失
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: jwworkflow-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
